name: テニス空き確認

on:
  schedule:
    # GitHubのcronはUTC（日本時間 = UTC + 9時間）。1時間半ごとなので2行に分けて指定
    # JST  8:45, 11:45, 14:45, 17:45, 20:45
    - cron: "45 23,2,5,8,11 * * *"
    # JST 10:15, 13:15, 16:15, 19:15, 22:15
    - cron: "15 1,4,7,10,13 * * *"
  workflow_dispatch: {}   # 手動実行ボタン（動作テスト用）

permissions:
  contents: write   # state.json をコミットするため

concurrency:
  group: vacancy-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check vacancy
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python check_vacancy.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
